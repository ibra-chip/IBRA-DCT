services:
  # Rollback target. Keep this service running until the Next/Nest cutover is reconciled.
  - type: web
    name: ibra-ba-legacy
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install --omit=dev --workspaces=false
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUBLIC_URL
        value: https://ibra-ba.net
      - key: APP_BASE_URL
        value: https://ibra-ba.net
      - key: IBRA_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-lite
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMS_SENDER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  # New relational API. Use a staging hostname first; do not attach the custom domain here yet.
  - type: web
    name: ibra-ba-api
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --include=dev; npx prisma db push; npx prisma generate; npm run build --workspace @ibra-ba/api
    startCommand: npm run start --workspace @ibra-ba/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IBRA_JWT_SECRET
        sync: false
      - key: WEB_ORIGIN
        value: https://ibra-ba-web.onrender.com
      - key: PUBLIC_URL
        value: https://ibra-ba-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SMTP_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  # New Next.js frontend. Attach ibra-ba.net only after staging/canary checks pass.
  - type: web
    name: ibra-ba-web
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --include=dev; npm run build --workspace @ibra-ba/web
    startCommand: npm run start --workspace @ibra-ba/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_ORIGIN
        value: https://ibra-ba-api.onrender.com

  # IbraApp messenger (chat + WebRTC calls). Standalone service, own SQLite data.
  # Needs a paid plan (not "free") because the persistent disk below, which is
  # what keeps accounts/messages/uploads across deploys and restarts, is not
  # available on Render's free tier.
  - type: web
    name: ibra-app
    runtime: node
    branch: main
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run start --workspace @ibra-ba/ibraapp-server
    healthCheckPath: /api/health
    disk:
      name: ibra-app-storage
      mountPath: /opt/render/project/src/apps/ibraapp-server/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: IBRAAPP_STORAGE_DIR
        value: /opt/render/project/src/apps/ibraapp-server/storage
      - key: IBRAAPP_JWT_SECRET
        sync: false
