name: Docker build check

# Catches a broken Dockerfile (e.g. a missing apk/apt package breaking the
# LibreDWG build) the moment it's pushed, instead of only failing silently
# in Cloud Run's own build - which nobody was watching, so production kept
# serving the old image for weeks while every deploy quietly failed.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (same Dockerfile Cloud Run builds)
        run: docker build -t ibra-ba-build-check .
